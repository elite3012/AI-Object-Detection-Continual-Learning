# Stronger PestNet-S candidate for the same reviewed 12-class IP102 scope.
# Keep pestnet_s.yaml as the reproducible baseline; use this config for the
# next metric-improvement run after checking the Model Lab failure analysis.
data:
  dataset_root: data/raw/ip102/ip102_v1.1
  manifest: artifacts/data/ip102_manifest.csv
  class_review: configs/data/ip102_class_review.yaml
  selected_class_ids: [1, 8, 40, 87, 72, 77, 83, 85, 58, 75, 89, 98]
  image_size: 224

model:
  name: pestnet_s
  width: 40
  dropout: 0.3

training:
  seed: 2026
  epochs: 40
  batch_size: 32
  learning_rate: 0.0008
  min_learning_rate: 0.00003
  weight_decay: 0.0002
  device: auto
  num_workers: 0
  class_strategy: weighted_loss
  loss: focal
  focal_gamma: 1.5
  label_smoothing: 0.04
  scheduler: cosine

augmentation:
  crop_scale: [0.72, 1.0]
  hflip_probability: 0.5
  rotation_degrees: 16.0
  color_jitter: 0.18

outputs:
  run_dir: artifacts/runs/pestnet_s_optimized
  bundle_dir: artifacts/models/pestnet_s_optimized_latest
