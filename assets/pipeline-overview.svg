<svg width="1200" height="790" viewBox="0 0 1200 790" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="790" rx="24" fill="#F7FAFC"/>
  <rect x="32" y="32" width="1136" height="726" rx="22" fill="white" stroke="#D9E2EC" stroke-width="2"/>

  <text x="64" y="96" fill="#102A43" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">
    Continual Learning System: recruiter overview
  </text>
  <text x="64" y="134" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    A benchmark-to-demo pipeline for sequential clothes classification, parameter-efficient updates,
  </text>
  <text x="64" y="160" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    multimodal fusion, and deployment-aware compression.
  </text>

  <rect x="64" y="192" width="1072" height="82" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="92" y="224" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    Scope note
  </text>
  <text x="202" y="220" fill="#334E68" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    Current implementation focuses on Fashion-MNIST clothing classification under continual learning,
  </text>
  <text x="202" y="244" fill="#334E68" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    not full object detection.
  </text>

  <rect x="64" y="300" width="320" height="176" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="88" y="342" fill="#102A43" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    1. Experience Replay
  </text>
  <text x="88" y="374" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Fixed 5,000-sample ring buffer
  </text>
  <text x="88" y="400" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Balanced sampling across classes
  </text>
  <text x="88" y="426" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    FIFO replacement keeps memory
  </text>
  <text x="88" y="452" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    bounded while tasks increase
  </text>

  <rect x="408" y="300" width="320" height="176" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="432" y="342" fill="#102A43" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    2. PEFT / LoRA
  </text>
  <text x="432" y="374" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Low-rank adapters injected into
  </text>
  <text x="432" y="400" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    convolutional and linear layers
  </text>
  <text x="432" y="426" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Rank and alpha configurable in UI
  </text>
  <text x="432" y="452" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    for cheaper continual updates
  </text>

  <rect x="752" y="300" width="320" height="176" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="776" y="342" fill="#102A43" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    3. Multimodal Fusion
  </text>
  <text x="776" y="374" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Vision encoder plus text encoder
  </text>
  <text x="776" y="400" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Concat, gated, and cross-attention
  </text>
  <text x="776" y="426" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Text descriptions add semantic cues
  </text>
  <text x="776" y="452" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    for ambiguous visual classes
  </text>

  <rect x="236" y="508" width="320" height="176" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="260" y="550" fill="#102A43" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    4. Hardware Optimization
  </text>
  <text x="260" y="582" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Structured pruning and INT8 / FP16
  </text>
  <text x="260" y="608" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Mobile, GPU, edge, and cloud presets
  </text>
  <text x="260" y="634" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Compression and latency benchmarks
  </text>
  <text x="260" y="660" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    built into the workflow
  </text>

  <rect x="644" y="508" width="320" height="176" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="668" y="550" fill="#102A43" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    5. Streamlit Demo Layer
  </text>
  <text x="668" y="582" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Sidebar controls for every phase
  </text>
  <text x="668" y="608" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Plotly charts for accuracy, forgetting,
  </text>
  <text x="668" y="634" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    buffer distribution, timing, and testing
  </text>
  <text x="668" y="660" fill="#486581" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Image upload plus preprocessing flow
  </text>
</svg>
