services:
  app:
    build:
      context: .
    image: pestscope-ip102:latest
    ports:
      - "8000:8000"
    environment:
      PESTSCOPE_DEVICE: ${PESTSCOPE_DEVICE:-cpu}
      PESTSCOPE_MODEL_BUNDLE: /app/artifacts/models/pestnet_s_latest
      PESTSCOPE_ACCEPT_THRESHOLD: ${PESTSCOPE_ACCEPT_THRESHOLD:-0.55}
      PESTSCOPE_UNCERTAIN_THRESHOLD: ${PESTSCOPE_UNCERTAIN_THRESHOLD:-0.25}
      PESTSCOPE_ALLOW_DEMO_MODEL: ${PESTSCOPE_ALLOW_DEMO_MODEL:-true}
      PESTSCOPE_FETCH_DEMO_IMAGES: ${PESTSCOPE_FETCH_DEMO_IMAGES:-true}
      PESTSCOPE_DEMO_CACHE_DIR: /app/artifacts/demo_assets
      PESTSCOPE_REVIEW_DB: /app/artifacts/reviews.sqlite3
    volumes:
      - pestscope-artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  pestscope-artifacts:
