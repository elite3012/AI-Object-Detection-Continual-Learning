services:
  app:
    build:
      context: .
      args:
        VISION_MODEL_NAME: ${VISION_MODEL_NAME:-openai/clip-vit-base-patch32}
    image: adaptive-vision-service:latest
    ports:
      - "8000:8000"
    environment:
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-openai/clip-vit-base-patch32}
      VISION_DEVICE: ${VISION_DEVICE:-auto}
      VISION_STATE_PATH: /app/artifacts/prototypes.json
      VISION_CONFIDENCE_THRESHOLD: ${VISION_CONFIDENCE_THRESHOLD:-0.90}
    volumes:
      - prototype-data:/app/artifacts
    restart: unless-stopped

volumes:
  prototype-data:
